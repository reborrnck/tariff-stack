name: Daily Tariff Data Refresh

# 每天北京时间 03:17 自动刷新关税数据 → 重新构建 → 重新部署到 Cloudflare Worker (Static Assets)。
# 运行在 GitHub 服务器（美国），与用户本机开关机无关。
#
# ⚠️ 关键修复（2026-09-05）：此前工作流只把数据 commit/push 到 git，但没有任何构建/部署步骤，
#   线上 tariff-stack.zmarkz123zxc.workers.dev 一直停在最后一次手动部署的陈旧 dist，
#   导致"Actions 在跑、页面数据/日期不变"的伪刷新。现改为刷新后自建自部署，闭环。
#
# 项目类型（以 wrangler CLI 报错为铁证）：本项目是 Cloudflare Worker（wrangler.toml 用 [assets]
#   directory="./dist" 发布静态资源，缺 pages_build_output_dir），不是 Pages。部署命令用 `npx wrangler deploy`。
#
# 鉴权（以 Run #5 成功部署为准）：scoped API Token，权限 = Account.Workers Scripts:Edit
#   CLOUDFLARE_API_TOKEN  Cloudflare API Token（权限 Workers Scripts:Edit）。

on:
  schedule:
    # 每天北京时间 03:17（用官方 IANA timezone，避免手写 UTC 偏移算错）。
    # ⚠️ 不用整点(:00)/半点(:30)：GitHub Actions 的 cron 在整点/半点因全局调度高峰
    # 常延迟 5-30 分钟、极端时直接被丢弃（官方文档明示 "may be delayed / in the worst
    # case may not run"）。业界共识：把分钟挪到 17/23/37/43 这类非高峰档，调度可靠性提升。
    # 本项目 2026-09-07 实测：设在 :00 的 03:00 定时 run 当天未产生任何提交（被高峰丢弃），
    # 挪到 :17 + timezone 后规避此坑。
    - cron: '17 3 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch: {}   # 允许在 Actions 标签页手动触发（调试/立即生效用）

# 防止定时触发与手动触发重叠导致两个 run 同时向 main 推送（非快进冲突）
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# 最小权限：官方要求 workflow 默认只给 read，再按需提升。
# - contents: write  允许刷新脚本 git commit/push 数据更新
# - actions: read    允许 upload-artifact 读取 workflow run 信息（@v4 必需，否则 artifact 步骤可能失败）
permissions:
  contents: write
  actions: read

# run-name 让 Actions 列表一眼看清每次 run 的性质（官方推荐的可读性实践）
run-name: Tariff refresh (${{ github.event_name }})

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 整点 cron 常被 GitHub 静默丢弃且不报错；用块字面量把触发信息打到日志，
      # 用户能在 Actions -> 该 run -> 此步 直接看到"今天到底有没有触发"，避免再次误判为伪刷新。
      # ⚠️ 必须用 | 块语法而不是单行字符串；否则 YAML 把 echo "Schedule fired: ${{..." 里的
      # 冒号当 mapping 分隔符解析，直接 syntax error（2026-09-07 b947168 踩坑，已改 5765594）。
      - name: Schedule heartbeat
        run: |
          echo "Schedule fired: ${{ github.event.schedule }}"
          echo "Runner UTC now: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Beijing time:    $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure git identity
        # 用 --local 只影响本仓库（ephemeral runner 上 --global 亦可，但 --local 更规范）
        run: |
          git config --local user.email "TariffStack@outlook.com"
          git config --local user.name "TariffStack"

      - name: Fetch sources (US HTS base + China-301 mapping)
        # 全自动铁律：基表升版不再需要人工跑 preprocess。US HTS 从 USITC 官方直链按最新
        # rev 自动下载；China-301 映射 PDF 随仓库入库于 data-src/，此处拷到 TARIFF_DATA_DIR。
        env:
          TARIFF_DATA_DIR: ${{ runner.temp }}/tariff-data
        run: python scripts/fetch_sources.py

      - name: Install Python deps
        # preprocess_full(pypdf) / build_cn_tariff(pdfplumber) 在重建基表时需要；
        # 从 requirements.txt 钉版本安装，避免 CI 无锁漂移（2026-09-07 审计后加）。
        run: python -m pip install -r requirements.txt

      - name: Run daily refresh (多源核对 + 写回真值 + 提交推送 git)
        env:
          # CI 中仓库根即平台目录；报告写到临时目录（作为 artifact 留存）
          PLATFORM_DIR: ${{ github.workspace }}
          REPORT_DIR: ${{ runner.temp }}/reports
          TARIFF_DATA_DIR: ${{ runner.temp }}/tariff-data
        run: python scripts/refresh_daily.py

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: ${{ runner.temp }}/reports/*.md
          if-no-files-found: ignore
          retention-days: 7   # 审计报告只留 7 天，避免 artifact 无限累积（铁律：定时清理旧数据）

      # ===== 关键修复：刷新数据后必须重建并重新部署，否则线上永远停在旧构建（伪刷新） =====
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Worker (Static Assets)
        # 钉 wrangler 主版本（4.x）避免 npx 拉到未来破坏性大版本导致部署静默失败。
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # 注：若 CLOUDFLARE_API_TOKEN 未配置/权限不对，wrangler 会因缺鉴权使本 run 变红，暴露"未部署"。

      # ===== 定时清理旧数据（铁律：防止审计日志/临时锁文件无限累积） =====
      # 每日刷新跑完即清理：删除超过 30 天的 FRESHNESS_REPORT、以及 *.tmp / *.pending.json 锁残留。
      # 真实税率数据（tariff_full*.json / policy_overlay.json / news_feed.json / origins.json）受脚本保护，绝不删除。
      # CI 中 runner.temp/reports 为临时目录本就随 job 销毁；此步主要兜底仓库内可能残留的 *.tmp/*.pending.json。
      - name: Cleanup old data
        if: always()
        run: python scripts/cleanup_old_data.py
