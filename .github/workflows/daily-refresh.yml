name: Daily Tariff Data Refresh

# 每天北京时间 03:00 自动刷新关税数据 → 重新构建 → 重新部署到 Cloudflare Worker (Static Assets)。
# 运行在 GitHub 服务器（美国），与用户本机开关机无关。
#
# ⚠️ 关键修复（2026-09-05）：此前工作流只把数据 commit/push 到 git，但没有任何构建/部署步骤，
#   线上 tariff-stack.zmarkz123zxc.workers.dev 一直停在最后一次手动部署的陈旧 dist，
#   导致"Actions 在跑、页面数据/日期不变"的伪刷新。现改为刷新后自建自部署，闭环。
#
# 项目类型（以 wrangler CLI 报错为铁证）：本项目是 Cloudflare Worker（wrangler.toml 用 [assets]
#   directory="./dist" 发布静态资源，缺 pages_build_output_dir），不是 Pages。CLI 实测明确提示
#   "Pages project 'tariff-stack' does not exist ... Did you mean to run `wrangler deploy`?"。
#   部署命令用 `npx wrangler deploy`。
#   （曾两次误判：先以为 *.pages.dev 是 Pages 项目，再以为"账号只有 Pages 权限所以是 Pages"。
#    实际账号 Token 权限下拉无 Workers 选项是因为从未启用 Worker 权限项，而项目本身确为 Worker。）
#
# 鉴权（My Profile → API Keys → Global API Key，绕开 API Token 权限下拉无 Workers 选项的死结）：
#   CLOUDFLARE_API_KEY    Cloudflare 全局 API Key（账户全权限，CI 用足够；泄露可滚）
#   CLOUDFLARE_EMAIL      Cloudflare 登录邮箱
on:
  schedule:
    # 19:00 UTC = 次日 03:00 北京时间 (UTC+8)
    - cron: '0 19 * * *'
  workflow_dispatch: {}   # 允许在 Actions 标签页手动触发（调试/立即生效用）

# 防止定时触发与手动触发重叠导致两个 run 同时向 main 推送（非快进冲突）
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write        # 允许 GITHUB_TOKEN 提交并 push 数据更新

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure git identity
        run: |
          git config user.email "TariffStack@outlook.com"
          git config user.name "TariffStack"

      - name: Fetch sources (US HTS base + China-301 mapping)
        # 全自动铁律：基表升版不再需要人工跑 preprocess。US HTS 从 USITC 官方直链按最新
        # rev 自动下载；China-301 映射 PDF 随仓库入库于 data-src/，此处拷到 TARIFF_DATA_DIR。
        env:
          TARIFF_DATA_DIR: ${{ runner.temp }}/tariff-data
        run: python scripts/fetch_sources.py

      - name: Install Python deps
        # preprocess_full(pypdf) / build_cn_tariff(pdfplumber) 在重建基表时需要；
        # 仓库无 requirements.txt，此处显式安装，避免 CI 跑预处理时 ModuleNotFoundError。
        run: python -m pip install pypdf pdfplumber

      - name: Run daily refresh (多源核对 + 写回真值 + 提交推送 git)
        env:
          # CI 中仓库根即平台目录；报告写到临时目录（作为 artifact 留存）
          PLATFORM_DIR: ${{ github.workspace }}
          REPORT_DIR: ${{ runner.temp }}/reports
          TARIFF_DATA_DIR: ${{ runner.temp }}/tariff-data
        run: python scripts/refresh_daily.py

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: ${{ runner.temp }}/reports/*.md
          if-no-files-found: ignore
          retention-days: 7   # 审计报告只留 7 天，避免 artifact 无限累积（铁律：定时清理旧数据）

      # ===== 关键修复：刷新数据后必须重建并重新部署，否则线上永远停在旧构建（伪刷新） =====
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Worker (Static Assets)
        # 线上 tariff-stack.zmarkz123zxc.workers.dev 是一个 Cloudflare Worker（wrangler.toml 用
        # [assets] directory="./dist" 服务静态资源，无 KV/R2/D1 等绑定）。CI 报错 wrangler CLI 已明确指出：
        #   "Pages project 'tariff-stack' does not exist. ... wrangler.toml does not appear to be
        #    for a Pages project (missing pages_build_output_dir). Did you mean `wrangler deploy`?"
        # 故必须用 `wrangler deploy` 而非 `wrangler pages deploy`。
        # 鉴权：用 scoped API Token（权限 Account.Workers Scripts:Edit），不碰 2FA、不依赖全局 Key。
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # 注：若 CLOUDFLARE_API_TOKEN 未配置/权限不对，wrangler 会因缺鉴权使本 run 变红，暴露"未部署"。

      # ===== 定时清理旧数据（铁律：防止审计日志/临时锁文件无限累积） =====
      # 每日刷新跑完即清理：删除超过 30 天的 FRESHNESS_REPORT、以及 *.tmp / *.pending.json 锁残留。
      # 真实税率数据（tariff_full*.json / policy_overlay.json / news_feed.json / origins.json）受脚本保护，绝不删除。
      # CI 中 runner.temp/reports 为临时目录本就随 job 销毁；此步主要兜底仓库内可能残留的 *.tmp/*.pending.json。
      - name: Cleanup old data
        if: always()
        run: python scripts/cleanup_old_data.py
